<script>
/* WebAudio 合成音效（背景音樂見 music.js） */
(function () {
  'use strict';
  var SFX = { ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null, mode: 0, last: {} };
  // mode: 0 = 全開, 1 = 音樂關（音效開）, 2 = 全部靜音
  try { SFX.mode = parseInt(localStorage.getItem('raiden_snd') || '0', 10) || 0; } catch (e) {}
  Object.defineProperty(SFX, 'muted', { get: function () { return this.mode === 2; } });

  SFX.init = function () {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !this.paused) this.ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    var c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 1; this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.connect(this.master);
    this.applyMode();
    var len = c.sampleRate;
    var b = c.createBuffer(1, len, c.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
    MUSIC.setup(c, this.musicBus, b);
    if (c.state === 'suspended') c.resume();
  };
  SFX.applyMode = function () {
    if (!this.sfxBus) return;
    this.sfxBus.gain.value = this.mode === 2 ? 0 : 0.35;
    this.musicBus.gain.value = this.mode === 0 ? 0.3 : 0;
  };
  SFX.setMode = function (m) {
    this.mode = m;
    try { localStorage.setItem('raiden_snd', String(m)); } catch (e) {}
    this.applyMode();
    if (window.onSoundMode) window.onSoundMode(m);
  };
  SFX.cycle = function () { this.setMode((this.mode + 1) % 3); };
  SFX.toggleMute = function () { this.setMode(this.mode === 2 ? 0 : 2); };
  SFX.pause = function (p) {
    this.paused = p;
    if (!this.ctx) return;
    if (p) this.ctx.suspend(); else this.ctx.resume();
  };

  SFX.tone = function (type, f0, f1, dur, vol, delay) {
    var c = this.ctx; if (!c) return;
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  };
  SFX.noise = function (dur, vol, f0, f1, delay) {
    var c = this.ctx; if (!c || !this.noiseBuf) return;
    var t = c.currentTime + (delay || 0);
    var s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    var f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    var g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  };

  // 紫色閃電持續的嗡嗡電流聲：一組常駐節點，每幀呼叫續命，沒續就自動淡出
  SFX.plasma = function (on, lv) {
    var c = this.ctx;
    if (!c || c.state !== 'running') return;
    if (!this.pz) {
      var g = c.createGain(); g.gain.value = 0;
      var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 1.2;
      var o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 82;
      var o2 = c.createOscillator(); o2.type = 'square'; o2.frequency.value = 123; o2.detune.value = 9;
      var lfo = c.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 31; var lg = c.createGain(); lg.gain.value = 500;
      lfo.connect(lg); lg.connect(bp.frequency);
      var ns = c.createBufferSource(); ns.buffer = this.noiseBuf; ns.loop = true; var nf = c.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 3500; var ng = c.createGain(); ng.gain.value = 0.35;
      ns.connect(nf); nf.connect(ng); ng.connect(g);
      o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(this.sfxBus);
      o1.start(); o2.start(); lfo.start(); ns.start();
      this.pz = { g: g, o1: o1, lfo: lfo };
    }
    var t = c.currentTime, P = this.pz;
    P.g.gain.cancelScheduledValues(t);
    P.g.gain.setTargetAtTime(on && this.mode !== 2 ? 0.075 : 0, t, 0.025);
    if (on) { P.g.gain.setTargetAtTime(0, t + 0.09, 0.03); P.o1.frequency.setTargetAtTime(78 + (lv || 1) * 6 + Math.random() * 6, t, 0.03); P.lfo.frequency.setValueAtTime(24 + Math.random() * 16, t); }
  };

  var MIN_GAP = { zap: 0.08, shot: 0.07, laser: 0.09, missile: 0.15, hit: 0.05, exS: 0.04, exM: 0.06, exL: 0.15, medal: 0.05 };
  SFX.play = function (name) {
    if (!this.ctx || this.mode === 2 || this.ctx.state !== 'running') return;
    var now = this.ctx.currentTime;
    var gap = MIN_GAP[name] || 0;
    if (gap && this.last[name] && now - this.last[name] < gap) return;
    this.last[name] = now;
    switch (name) {
      case 'shot': this.tone('square', 1100, 500, 0.05, 0.045); break;
      case 'laser': this.tone('sawtooth', 1600, 1100, 0.07, 0.03); break;
      case 'missile': this.noise(0.12, 0.07, 3000, 800); break;
      case 'hit': this.tone('square', 260, 180, 0.03, 0.03); break;
      case 'exS': this.noise(0.3, 0.35, 2500, 150); this.tone('sine', 160, 50, 0.25, 0.2); break;
      case 'exM': this.noise(0.6, 0.5, 2000, 90); this.tone('sine', 120, 35, 0.5, 0.3); break;
      case 'exL': this.noise(1.4, 0.7, 1800, 50); this.tone('sine', 90, 25, 1.2, 0.45); break;
      case 'bomb': this.noise(2.0, 0.8, 4000, 40); this.tone('sawtooth', 300, 30, 1.5, 0.25); this.tone('sine', 70, 20, 2.0, 0.5); break;
      case 'power': [660, 880, 1100, 1320].forEach(function (f, i) { SFX.tone('square', f, f, 0.07, 0.06, i * 0.06); }); break;
      case 'medal': this.tone('sine', 1500, 2400, 0.12, 0.08); this.tone('sine', 2200, 2600, 0.1, 0.05, 0.05); break;
      case 'item': this.tone('triangle', 500, 1500, 0.15, 0.1); break;
      case 'die': this.noise(1.2, 0.7, 3000, 60); this.tone('sawtooth', 700, 40, 1.0, 0.25); break;
      case 'alarm': this.tone('square', 520, 520, 0.22, 0.08); this.tone('square', 390, 390, 0.22, 0.08, 0.25); break;
      case 'beam': this.tone('sawtooth', 120, 90, 0.8, 0.12); this.noise(0.8, 0.2, 1200, 300); break;
      case 'start': [440, 554, 659, 880].forEach(function (f, i) { SFX.tone('square', f, f, 0.12, 0.07, i * 0.1); }); break;
      case 'zap': this.noise(0.09, 0.12, 6000, 1500); this.tone('sawtooth', 900, 200, 0.07, 0.04); break;
      case 'tick': this.tone('square', 1200, 1200, 0.03, 0.04); break;
      case 'pause': this.tone('triangle', 800, 400, 0.12, 0.08); break;
    }
  };
  window.SFX = SFX;


})();

/* 雲層（遠慢／近快視差，每關不同顏色） */

  [110, 110, 115, 0.16, 0.28, 4, 4],

}

}

/* 近景微粒（沙塵／海霧／煙塵，半透明且不擋子彈） */

/* 遠景剪影（比地形慢，半透明疊在地形上） */

      ctx.beginPath();

      ctx.lineTo(x + w * 0.25, y - hh);
      ctx.lineTo(x + w * 0.55, y - hh * 0.55);

/* ---------- 粒子 / 爆炸 ---------- */

}

  g.addColorStop(0.82, 'rgba(' + rgb + ',0.95)');

  g.addColorStop(1, 'rgba(' + rgb + ',0)');

const FIRE_HOT = makeFireSprite([[0, 'rgba(255,255,230,1)'], [0.35, 'rgba(255,210,80,0.95)'], [0.7, 'rgba(250,110,30,0.6)'], [1, 'rgba(120,20,0,0)']]);

const HALO_COLD = makeFireSprite([[0, 'rgba(240,255,255,1)'], [0.2, 'rgba(160,230,255,0.8)'], [0.55, 'rgba(60,140,255,0.35)'], [1, 'rgba(20,40,180,0)']]);
const HALO_PURP = makeFireSprite([[0, 'rgba(255,240,255,1)'], [0.2, 'rgba(230,170,255,0.85)'], [0.55, 'rgba(160,60,255,0.4)'], [1, 'rgba(80,0,160,0)']]);

const particles = [], decals = [], texts = [];
let shake = 0, flashScreen = 0, hudHit = 0;
const MAX_FX = 280;

function triggerHitFlash() { hudHit = 1; }

function evictFx() {
  let idx = -1, best = 1e9;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.keep) continue;
    const pri = (p.delay > 0 ? 8 : 0) + (p.t === 'smoke' ? 0 : p.t === 'spark' ? 1 : p.t === 'debris' ? 2 : 4) + p.life;
    if (pri < best) { best = pri; idx = i; }
  }
  if (idx < 0) idx = 0;
  particles.splice(idx, 1);
}
function capFx() { while (particles.length > MAX_FX) evictFx(); }
function addP(p) { if (particles.length >= MAX_FX) evictFx(); particles.push(p); }
function fxRoom() { return Math.max(0, 1 - particles.length / MAX_FX); }

function addShake(v) { shake = Math.max(shake, v); }
function haloFor(col) {
  const c = col || '';
  if (c === '#9ef' || c === '#aef' || c === '#cfe8ff' || c.indexOf('#5') === 0 || c.indexOf('#6') === 0 || c.indexOf('#8') === 0 || c.indexOf('#9') === 0 || c.indexOf('#ae') === 0 || c.indexOf('#cf') === 0) return HALO_COLD;
  if (c.indexOf('#c0') === 0 || c.indexOf('#c08') === 0 || c.indexOf('#d0') === 0 || c.indexOf('#e0a') === 0 || c.indexOf('ff') === 4 && c.indexOf('#e') === 0 || c === '#e0a0ff' || c === '#d090ff') return HALO_PURP;
  if (c === '#fff' || c === '#ccc' || c === '#ffffff') return HALO_WHITE;
  return HALO_WARM;
}
function spark(x, y, n, col, spd) {
  if (n >= 2) addP({ t: 'halo', x, y, life: 0.1, max: 0.1, size: 7 + n * 1.4, spr: haloFor(col) });
  const q = 0.5 + 0.5 * fxRoom();
  const nn = Math.max(1, Math.round(n * q));
  for (let i = 0; i < nn; i++) {
    const a = rand(0, TAU), s = rand(0.3, 1) * (spd || 200);
    addP({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.15, 0.42), max: 0.42, col: col || '#ffd860', size: rand(1, 2.5) });
  }
}
function explode(x, y, size, opt) {
  opt = opt || {};

  const big = size >= 48;
  const boss = !!(opt.boss || size >= 70);
  const n = Math.max(3, Math.round((4 + size / 4) * q));
  addP({ t: 'halo', x, y, life: 0.16 + size / 500, max: 0.16 + size / 500, size: size * (boss ? 2.1 : 1.5), spr: size >= 80 ? HALO_WHITE : HALO_WARM, keep: boss });
  addP({ t: 'shock', x, y, life: 0.4, max: 0.4, size: size * 2.4, spr: RING_WARM, keep: true });
  if (big) addP({ t: 'shock', x, y, life: 0.55, max: 0.55, size: size * 3.1, spr: RING_WHITE, delay: 0.05 });
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = rand(0, size * 0.5);
    const life = rand(0.35, 0.7) * (0.7 + size / 80);
    addP({ t: 'fire', x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, vx: Math.cos(a) * rand(10, 50), vy: Math.sin(a) * rand(10, 50),
      life, max: life, size: rand(0.5, 1) * size * 0.55, delay: i * 0.012 * (size / 20) });
  }
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(60, 220) * (0.6 + size / 60);
    addP({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(20, 80), life: rand(0.3, 0.75), max: 0.75, col: Math.random() < 0.5 ? '#fff2a0' : '#ffa030', size: rand(1.2, 3) });
  }
  const sm = Math.round(n / 2);
  for (let i = 0; i < sm; i++) {
    const life = rand(0.6, 1.3);
    addP({ t: 'smoke', x: x + rand(-size, size) * 0.4, y: y + rand(-size, size) * 0.4, vx: rand(-20, 20), vy: rand(-30, 10), life, max: life, size: rand(0.4, 0.8) * size * 0.6, delay: 0.1 });
  }
  if (size >= 24) {
    const dn = Math.round((size / 8) * q);
    for (let i = 0; i < dn; i++) {
      const a = rand(0, TAU), s = rand(80, 280);
      addP({ t: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(40, 140), life: rand(0.55, 1.15), max: 1.15, size: rand(2, 5.5), rot: rand(0, TAU), vr: rand(-10, 10) });
    }
    addP({ t: 'ring', x, y, life: 0.45, max: 0.45, size: size * 2.2 });
  }
  if (boss) {
    const bursts = Math.round((size >= 110 ? 5 : 3) * q);
    for (let i = 0; i < bursts; i++) {
      const a = rand(0, TAU), d = rand(size * 0.15, size * 0.7);
      const bx = x + Math.cos(a) * d, by = y + Math.sin(a) * d;
      const delay = 0.05 + i * 0.07, bs = size * rand(0.28, 0.48);
      addP({ t: 'halo', x: bx, y: by, life: 0.2, max: 0.2, size: bs * 1.6, spr: HALO_WARM, delay: delay, keep: true });
      addP({ t: 'shock', x: bx, y: by, life: 0.35, max: 0.35, size: bs * 2.2, spr: i % 2 ? RING_WHITE : RING_WARM, delay: delay });
      const fn = Math.round(4 * q);
      for (let k = 0; k < fn; k++) {
        const fa = rand(0, TAU), life = rand(0.3, 0.6);
        addP({ t: 'fire', x: bx, y: by, vx: Math.cos(fa) * rand(20, 70), vy: Math.sin(fa) * rand(20, 70), life, max: life, size: bs * rand(0.4, 0.8), delay: delay + k * 0.01 });
      }
      for (let k = 0; k < fn; k++) {
        const fa = rand(0, TAU), s = rand(80, 240);
        addP({ t: 'spark', x: bx, y: by, vx: Math.cos(fa) * s, vy: Math.sin(fa) * s - 60, life: rand(0.3, 0.7), max: 0.7, col: Math.random() < 0.5 ? '#fff2a0' : '#ffa030', size: rand(1.2, 3), delay: delay });

function floatText(x, y, str, col) { texts.push({ x, y, str, col: col || '#fff', life: 1.1 }); }

function updateFx(dt, scrollSpeed) {
  capFx();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; }

/* =============== 通用中BOSS =============== */

/* =============== 通用多部位 BOSS =============== */
function spawnGBoss(def) {
  const b = mkEnemy('gboss', W / 2, def.y0 || -190, { hp: 1, r: 0, collide: false, score: 0, size: 0, phase: 0, persistent: true, parts: [], def, name: def.name,
    spin: 0, spin2: 0, dying: 0, cycle: 0, boss: true, ground: !!def.ground });
  for (const pd of def.parts) {

    p.maxHp = p.hp;
    if (pd.hidden) p.collide = false;
    b.parts.push(p);
  }
  const core = b.parts.find((p) => p.kind === 'core');

function BP(b, name) { const p = b.parts.find((q) => q.name === name); return p && !p.dead && !p.hidden ? p : null; }
function reveal(b, name) { const p = b.parts.find((q) => q.name === name); if (p && p.hidden) { p.hidden = false; p.collide = true; p.invuln = false; spark(p.x, p.y, 20, '#fff', 200); } }
UPD.gboss = function (b, dt) {

<script>
/* 主程式：狀態機、HUD、主迴圈、關卡流程 */
'use strict';
let state = 'title', stateT = 0, titleScroll = 0, titleTime = 0;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('raiden1_hi') || '0', 10) || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('raiden1_hi', String(hiScore)); } catch (e) {} }
function addScore(v) {
  const n = Math.round(v);
  if (!n) return;
  G.score += n;
  if (G.score > hiScore) hiScore = G.score;
  hud.scorePulse = Math.min(1, hud.scorePulse + (n >= 1000 ? 1 : 0.45));
}
const START_STAGE = clamp(parseInt(PARAMS.get('stage'), 10) || 1, 1, 5);
const AUTO = AUTOSTART || PARAMS.has('stage');

function setState(s) {
  state = s; stateT = 0;
  if (s === 'title') { CUR_STAGE = 1; initClouds(); MUSIC.play('title'); }
  else if (s === 'gameover') MUSIC.play('over');
  else if (s === 'clear') MUSIC.play('clear');
  else if (s === 'ending') MUSIC.play('ending');
  updateButtons();
}

function resetWorld() {
  pBullets.length = eBullets.length = enemies.length = items.length = 0;
  particles.length = decals.length = texts.length = beams.length = 0;
  boss = null; shake = 0; flashScreen = 0;
}
function loadStage(n, startT) {
  CUR_STAGE = n;
  const st = STAGES[n];
  Object.assign(G, { stage: n, tl: st.tl, t: 0, stageT: 0, scroll: 0, scrollSpeed: st.speed, evIdx: 0, pending: [], bombT: 0, warn: 0, warnSmall: 0,
    bossMode: false, bossDefeated: false, clearTimer: 0, running: true, missAtStage: G.misses, medalsAtStage: G.medals,
    bspd: 1 + 0.05 * (n - 1), rate: 1 + 0.08 * (n - 1) });
  resetWorld();
  initClouds();
  if (startT > 0) {
    G.t = startT; G.scroll = startT * st.speed;
    while (G.evIdx < G.tl.length && G.tl[G.evIdx][0] < startT) G.evIdx++;
    if (startT >= 160) { G.bossMode = true; G.scrollSpeed = 18; }
  }
  MUSIC.play(G.bossMode ? (n === 5 ? 'boss5' : 'boss') : st.music);
  MUSIC.prefetch([n === 5 ? 'boss5' : 'boss', 'clear', 'over'].concat(n === 5 ? ['ending'] : []));
}
function newGame(stage, startT) {
  G = { score: 0, lives: 3, misses: 0, medals: 0, medalValue: 500, kills: 0, continues: 0, gameOverDelay: 0, autoFire: false, stage: 1 };
  player = newPlayer();
  loadStage(stage, startT);
  if (startT > 0 || stage > 1) { player.level = startT > 0 ? 4 : 3; player.missile = 'H'; player.mlevel = 2; } // 除錯：中等火力
  if (WCOL.indexOf(PARAMS.get('weapon')) >= 0) player.weapon = PARAMS.get('weapon');
  if (PARAMS.get('level')) player.level = clamp(+PARAMS.get('level') | 0, 1, 5);
  resetHud(true);
}
function startGame() { newGame(START_STAGE, DEBUG_T); setState('play'); MUSIC.play(G.bossMode ? (G.stage === 5 ? 'boss5' : 'boss') : STAGES[G.stage].music); SFX.play('start'); }
function nextStage() {
  const p = player;
  loadStage(G.stage + 1, 0);
  p.alive = true; p.x = W / 2; p.y = H + 30; p.inv = 3; p.entering = 0.7;
  p.bombs = Math.min(7, p.bombs + 1);
  pBullets.length = 0;
  setState('play');
  MUSIC.play(STAGES[G.stage].music);
  SFX.play('start');
}

function pauseGame(on) {
  if (on && state === 'play') { setState('pause'); SFX.play('pause'); setTimeout(() => { if (state === 'pause') SFX.pause(true); }, 150); }
  else if (!on && state === 'pause') { SFX.pause(false); state = 'play'; stateT = 0; updateButtons(); SFX.play('pause'); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(true); });

function updatePlay(dt) {
  if (hit('KeyP', 'Escape') || UI.pause) { UI.pause = false; pauseGame(true); return; }
  G.stageT += dt;
  updateTimeline(dt);
  updateBg(dt, G.scrollSpeed, G.scroll);
  updatePlayer(dt);
  updateEnemies(dt);
  updatePBullets(dt);
  updateEBullets(dt);
  updateBeams(dt);
  updateBomb(dt);
  updateItems(dt);
  updateFx(dt, G.scrollSpeed);
  if (G.warn > 0) {
    const before = G.warn; G.warn -= dt;
    if (Math.floor(before / 0.6) !== Math.floor(G.warn / 0.6)) SFX.play('alarm');
  }
  if (G.warnSmall > 0) G.warnSmall -= dt;
  if (G.gameOverDelay > 0) {
    G.gameOverDelay -= dt;
    if (G.gameOverDelay <= 0) { G.goCount = 10; saveHi(); setState('gameover'); }
  }
  if (G.clearTimer > 0) {
    G.clearTimer -= dt;
    if (G.clearTimer <= 0) startClear();
  }
}

function startClear() {
  const p = player, nomiss = G.misses === G.missAtStage, md = G.medals - G.medalsAtStage;
  const lines = [
    ['殘機獎勵 LIFE', G.lives + ' × 10000', G.lives * 10000],
    ['炸彈獎勵 BOMB', p.bombs + ' × 3000', p.bombs * 3000],
    ['勳章獎勵 MEDAL', md + ' × 1000', md * 1000],
    ['無失誤獎勵 NO MISS', nomiss ? 'PERFECT' : '-', nomiss ? 50000 : 0]
  ];
  if (G.stage === 5) lines.push(['全破獎勵 ALL CLEAR', G.continues ? 'CONTINUE ×' + G.continues : 'NO CONTINUE', G.continues ? 100000 : 300000]);
  G.tally = { lines, shown: 0, t: 0, total: 0, done: false };
  G.running = false;
  pBullets.length = 0; eBullets.length = 0; beams.length = 0;
  setState('clear');
}

function anyConfirm() { const r = hit('Enter', 'NumpadEnter', 'Space', 'KeyZ') || touch.tap; touch.tap = false; return r; }

function updateClear(dt) {
  G.scroll += 40 * dt; G.scrollSpeed = 40;
  updateBg(dt, 40, G.scroll); updateFx(dt, 40);
  updateItems(dt);
  if (player.alive) player.y = Math.max(-60, player.y - (stateT > 1 ? 260 * dt : 0));
  const T = G.tally; T.t += dt;
  if (!T.done && T.t > 1.6 + T.shown * 0.6) {
    if (T.shown < T.lines.length) { const b = T.lines[T.shown][2]; addScore(b); T.total += b; T.shown++; SFX.play('tick'); }
    else { T.done = true; saveHi(); }
  }
  const ok = anyConfirm();
  if (!T.done && ok && T.t > 1) { // 點一下快轉結算
    while (T.shown < T.lines.length) { addScore(T.lines[T.shown][2]); T.shown++; }
    T.done = true; T.t = 99; saveHi(); return;
  }
  if (T.done && stateT > 0.8 && ok) {
    if (G.stage < 5) nextStage(); else { setState('ending'); G.endT = 0; }
  }
  if (T.done && hit('Escape')) setState('title');
}

function updateGameOver(dt) {
  updateBg(dt, G.scrollSpeed, G.scroll); updateFx(dt, G.scrollSpeed);
  G.goCount -= dt;
  if (stateT > 0.8 && anyConfirm()) {
    G.lives = 3; G.continues++; G.gameOverDelay = 0; G.score = Math.floor(G.score / 10) * 10 + Math.min(9, G.continues);
    player.alive = false; player.respawnT = 0.2; player.bombs = 3;
    state = 'play'; stateT = 0; updateButtons();
    MUSIC.play(G.bossMode ? (G.stage === 5 ? 'boss5' : 'boss') : STAGES[G.stage].music);
    SFX.play('start');
  } else if (hit('KeyR')) startGame();
  else if (G.goCount <= 0 || hit('Escape')) setState('title');
}

function updateEnding(dt) {
  G.endT += dt;
  G.scroll += 30 * dt;
  if (G.endT > 4 && anyConfirm()) setState('title');
  if (hit('Escape')) setState('title');
}

/* ================= 繪製 ================= */
function drawWorld(dt) {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawTerrain(G.scroll, G.t);
  drawFarLayer(G.scroll, G.t);
  drawDecals();
  for (const e of enemies) if (e.ground) DRW[e.type](e);
  drawNearLayer(G.scroll);
  drawItems();
  for (const e of enemies) if (e.type === 'boss') DRW.boss(e);
  for (const e of enemies) if (!e.ground && e.type !== 'boss') DRW[e.type](e);
  drawPBullets();
  if (state !== 'clear' || player.y > -50) drawPlayer();
  drawFx();
  drawBeams();
  drawEBullets();
  drawBomb();
  ctx.restore();
  if (flashScreen > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.8, flashScreen) + ')'; ctx.fillRect(0, 0, W, H); }
  if (hudHit > 0) {
    const a = Math.min(0.62, hudHit * 0.62);
    const g = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.2, W / 2, H * 0.55, H * 0.72);
    g.addColorStop(0, 'rgba(160,0,0,0)'); g.addColorStop(1, 'rgba(180,0,0,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

function txt(s, x, y, size, col, align, font) {
  ctx.font = (font || 'bold ') + size + 'px ' + '"Courier New", monospace';
  ctx.textAlign = align || 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function txtCJK(s, x, y, size, col, align) {
  ctx.font = 'bold ' + size + 'px "Noto Sans CJK TC","Noto Serif CJK TC","Microsoft JhengHei","PingFang TC",sans-serif';
  ctx.textAlign = align || 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}


/* ---------- 動態 HUD ---------- */
const hud = {
  score: 0, scorePulse: 0, lives: 3, bombs: 3, level: 1, weapFlash: 0,
  lifeFlash: 0, bombFlash: 0, barK: 1, barLag: 1, barPulse: 0, barA: 0,
  ghosts: [], levelFill: 1
};
function resetHud(snap) {
  hud.score = (snap && G) ? G.score : 0;
  hud.scorePulse = 0;
  hud.lives = G ? G.lives : 3;
  hud.bombs = (G && player) ? player.bombs : 3;
  hud.level = (player && player.level) || 1;
  hud.levelFill = hud.level;
  hud.weapFlash = hud.lifeFlash = hud.bombFlash = 0;
  hud.barK = hud.barLag = 1; hud.barPulse = 0; hud.barA = 0;
  hud.ghosts = [];
}
function updateHud(dt) {
  if (!G) return;
  const target = G.score;
  const diff = target - hud.score;
  if (diff !== 0) {
    const gap = Math.abs(diff);
    const step = Math.max(gap * (1 - Math.exp(-dt * 9)), Math.min(gap, 1800 * dt + gap * 0.15));
    hud.score += Math.sign(diff) * Math.min(gap, step);
    if (Math.abs(target - hud.score) < 0.5) hud.score = target;
  }
  hud.scorePulse = Math.max(0, hud.scorePulse - dt * 3.2);
  const lives = Math.max(0, G.lives);
  if (lives < hud.lives) {
    for (let i = lives; i < hud.lives; i++) hud.ghosts.push({ k: 'life', i: i, t: 1 });
    hud.lifeFlash = 1;
  }
  hud.lives = lives;
  hud.lifeFlash = Math.max(0, hud.lifeFlash - dt * 2.4);
  if (player) {
    const b = player.bombs;
    if (b < hud.bombs) { for (let i = b; i < hud.bombs; i++) hud.ghosts.push({ k: 'bomb', i: i, t: 1 }); hud.bombFlash = 1; }
    else if (b > hud.bombs) hud.bombFlash = 1;
    hud.bombs = b;
    if (player.level !== hud.level) { hud.level = player.level; hud.weapFlash = 1; }
    hud.levelFill += (player.level - hud.levelFill) * Math.min(1, dt * 10);
  }
  hud.bombFlash = Math.max(0, hud.bombFlash - dt * 2.6);
  hud.weapFlash = Math.max(0, hud.weapFlash - dt * 2.8);
  for (let i = hud.ghosts.length - 1; i >= 0; i--) {
    hud.ghosts[i].t -= dt * 2.3;
    if (hud.ghosts[i].t <= 0) hud.ghosts.splice(i, 1);
  }
  let bar = null;
  if (boss && boss.phase > 0) { const [h, m] = bossHp(); bar = { h, m }; }
  else for (const e of enemies) if (e.bossbar && e.phase === 1) bar = { h: e.hp, m: e.maxHp };
  if (bar && bar.m > 0) {
    hud.barA = Math.min(1, hud.barA + dt * 4);
    const k = clamp(bar.h / bar.m, 0, 1);
    if (k < hud.barK - 0.002) hud.barPulse = 1;
    hud.barK += (k - hud.barK) * Math.min(1, dt * 12);
    if (k < hud.barLag) hud.barLag += (k - hud.barLag) * Math.min(1, dt * 1.8);
    else hud.barLag = hud.barK;
  } else {
    hud.barA = Math.max(0, hud.barA - dt * 3);
  }
  hud.barPulse = Math.max(0, hud.barPulse - dt * 4);
}

function drawHUD() {
  const p = player;
  const sc = Math.floor(hud.score + 1e-6);
  const pulse = 1 + hud.scorePulse * 0.12;
  const scol = hud.scorePulse > 0 ? '#ffe58a' : '#fff';
  txt('1UP', 12, 22, 14, hud.lifeFlash > 0 ? '#ffb0b0' : '#ff6060', 'left');
  ctx.save();

    const pop = (hud.lifeFlash > 0 && i === lifeN - 1) ? 1 + hud.lifeFlash * 0.25 : 1;
    ctx.save(); ctx.translate(16 + i * 18, H - 18); ctx.scale(0.45 * pop, 0.45 * pop); drawPlayerShape(0, false); ctx.restore();
  }

    drawPlayerShape(0, false); ctx.restore();

  for (let i = 0; i < bombN; i++) {
    const x = W - 16 - i * 16, y = H - 18;

    ctx.restore();
  }

    const x = W - 16 - g.i * 16, y = H - 18 - (1 - g.t) * 8;
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = g.t; ctx.scale(0.7 + g.t * 0.5, 0.7 + g.t * 0.5);
    ctx.fillStyle = '#e07020'; ctx.beginPath(); ctx.ellipse(0, 0, 5, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillText('B', 0, 3);
    ctx.restore();
  }
  if (p) {
    const wn = WNAME[p.weapon], wc = { red: '#ff7050', blue: '#50b8ff', purple: '#c080ff' }[p.weapon];
    const wcol = hud.weapFlash > 0 ? '#fff' : wc;
    txt(wn + ' Lv' + p.level, W / 2 - 8, H - 12, 13, wcol, 'right');
    if (p.missile) txt((p.missile === 'H' ? 'HOMING' : 'MISSILE') + ' Lv' + p.mlevel, W / 2 + 8, H - 12, 13, p.missile === 'H' ? '#80e080' : '#e8d050', 'left');
    const fill = hud.levelFill;
    for (let i = 0; i < 5; i++) {
      const x = W / 2 - 66 + i * 12, y = H - 30;
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x, y, 9, 5);
      const frac = clamp(fill - i, 0, 1);
      if (frac > 0) {
        ctx.fillStyle = wc; ctx.globalAlpha = 0.55 + 0.45 * frac;
        if (hud.weapFlash > 0) ctx.globalAlpha = Math.min(1, ctx.globalAlpha + hud.weapFlash * 0.5);
        ctx.fillRect(x, y, 9 * frac, 5);
        ctx.globalAlpha = 1;
      }
    }
  }
  let bar = null;
  if (boss && boss.phase > 0) { const [h, m] = bossHp(); bar = { h, m, name: boss.name || 'FLYING FORTRESS' }; }
  else for (const e of enemies) if (e.bossbar && e.phase === 1) bar = { h: e.hp, m: e.maxHp, name: e.name };
  if (bar && hud.barA > 0) {
    const bw = W - 40;
    ctx.globalAlpha = hud.barA;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(20, 32, bw, 10);
    const lag = clamp(hud.barLag, 0, 1), k = clamp(hud.barK, 0, 1);
    ctx.fillStyle = '#7a2010'; ctx.fillRect(22, 34, (bw - 4) * lag, 6);
    const g = ctx.createLinearGradient(20, 0, 20 + bw, 0); g.addColorStop(0, '#ff3030'); g.addColorStop(1, hud.barPulse > 0 ? '#fff0c0' : '#ffb030');
    ctx.fillStyle = g; ctx.fillRect(22, 34, (bw - 4) * k, 6);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(20.5, 32.5, bw - 1, 9);
    txt(bar.name, 22, 56, 11, '#ffc0c0', 'left');
    ctx.globalAlpha = 1;
  }
  if (GOD) txt('GOD', 10, H - 34, 11, '#f88', 'left');
  if (DEBUG_T > 0 || PARAMS.has('stage')) txt('S' + G.stage + ' t=' + G.t.toFixed(1), 10, 72, 11, '#8f8', 'left');
  if (G.warn > 0 && Math.floor(G.warn * 3) % 2 === 0) {
    ctx.fillStyle = 'rgba(200,0,0,0.35)'; ctx.fillRect(0, H / 2 - 60, W, 100);
    ctx.fillStyle = '#ff3030'; ctx.fillRect(0, H / 2 - 60, W, 4); ctx.fillRect(0, H / 2 + 36, W, 4);
    txt('WARNING!!', W / 2, H / 2 - 4, 44, '#ffdddd');
    txt(G.stage === 5 ? 'THE ENEMY MOTHERSHIP IS APPROACHING' : 'A HUGE ENEMY IS APPROACHING', W / 2, H / 2 + 24, 14, '#ffb0b0');
  }
  if (G.warnSmall > 0 && Math.floor(G.warnSmall * 4) % 2 === 0) txt('- CAUTION -', W / 2, 110, 20, '#ffd040');
  if (G.stageT < 3.5 && G.t < 160 && state === 'play') {
    const a = Math.min(1, (3.5 - G.stageT) * 2);
    ctx.globalAlpha = a;
    txt('STAGE ' + G.stage, W / 2, H / 2 - 20, 34, '#fff');
    txtCJK(STAGES[G.stage].sub, W / 2, H / 2 + 16, 18, '#9fd8ff');
    ctx.globalAlpha = 1;
  }
}

function drawTitle(dt) {
  titleScroll += 30 * dt; titleTime += dt;
  CUR_STAGE = 1;
  updateBg(dt, 30, titleScroll % 1100);
  drawTerrain(titleScroll % 1100, titleTime);
  drawFarLayer(titleScroll % 1100, titleTime);
  drawNearLayer(titleScroll % 1100);
  ctx.fillStyle = 'rgba(0,10,30,0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, (H - 640) / 2);
  ctx.save();
  ctx.translate(W / 2, 165);
  const g = ctx.createLinearGradient(0, -60, 0, 20);
  g.addColorStop(0, '#fff8c0'); g.addColorStop(0.5, '#ffb020'); g.addColorStop(1, '#c02010');
  ctx.font = 'bold 92px "Noto Sans CJK TC","Noto Serif CJK TC","Microsoft JhengHei","PingFang TC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText('雷電', 4, 4);
  ctx.lineWidth = 6; ctx.strokeStyle = '#401008'; ctx.strokeText('雷電', 0, 0);
  ctx.fillStyle = g; ctx.fillText('雷電', 0, 0);
  ctx.restore();
  txt('R A I D E N  S T Y L E', W / 2, 205, 20, '#9fd8ff');
  txt('- 5 STAGES -', W / 2, 232, 16, '#ffffff');
  ctx.save(); ctx.translate(W / 2, 305 + Math.sin(titleTime * 2) * 6); ctx.scale(1.6, 1.6); drawPlayerShape(Math.sin(titleTime) * 0.3, true); ctx.restore();
  if (Math.floor(titleTime * 2) % 2 === 0) txtCJK('點擊畫面 或 按 ENTER 開始', W / 2, 395, 19, '#ffe060');
  const L = [['←↑↓→ / WASD', '移動（Shift 慢速）'], ['Z / SPACE', '射擊（按住連射）'], ['X', '炸彈'], ['P', '暫停'], ['M', '聲音開關'], ['手機', '拖曳移動・自動射擊'], ['', '雙指點擊 或 B 鈕 = 炸彈']];
  for (let i = 0; i < L.length; i++) {
    txtCJK(L[i][0], W / 2 - 10, 435 + i * 22, 14, '#ffd890', 'right');
    txtCJK(L[i][1], W / 2 + 10, 435 + i * 22, 14, '#ffffff', 'left');
  }
  txt('HI-SCORE ' + hiScore, W / 2, 605, 16, '#ffd040');
  txt('procedural canvas game · 5 stages', W / 2, 628, 10, 'rgba(255,255,255,0.5)');
  ctx.restore();
  if (stateT > 0.3 && anyConfirm()) startGame();
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,20,0.55)'; ctx.fillRect(0, 0, W, H);
  txt('PAUSE', W / 2, H / 2 - 10, 44, '#fff');
  txtCJK('P 繼續　ESC 回標題', W / 2, H / 2 + 30, 16, '#ccc');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(30,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  txt('GAME OVER', W / 2, H / 2 - 60, 46, '#ff5050');
  txt('CONTINUE?', W / 2, H / 2, 26, '#fff');
  txt(String(Math.max(0, Math.ceil(G.goCount))), W / 2, H / 2 + 54, 48, '#ffe060');
  txtCJK('點擊 / ENTER 接關　R 重新開始　ESC 回標題', W / 2, H / 2 + 100, 15, '#ddd');
  txt('SCORE ' + G.score, W / 2, H / 2 + 140, 18, '#fff');
}

function drawClear() {
  ctx.fillStyle = 'rgba(0,10,30,' + Math.min(0.6, stateT * 0.6) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, (H - 640) / 2);
  const T = G.tally;
  const pulse = 1 + Math.sin(stateT * 4) * 0.04;
  ctx.save(); ctx.translate(W / 2, 140); ctx.scale(pulse, pulse);
  txt('STAGE ' + G.stage + ' CLEAR', 0, 0, 40, '#ffe060'); ctx.restore();
  txtCJK(['', '第一關', '第二關', '第三關', '第四關', '最終關'][G.stage] + '　完成！', W / 2, 180, 20, '#9fd8ff');
  for (let i = 0; i < T.shown; i++) {
    const y = 235 + i * 36;
    txtCJK(T.lines[i][0], 30, y, 15, '#fff', 'left');
    txt(T.lines[i][1], 320, y, 13, '#aaa', 'right');
    txt(String(T.lines[i][2]), W - 30, y, 16, '#ffe060', 'right');
  }
  if (T.done) {
    ctx.fillStyle = '#fff'; ctx.fillRect(30, 430, W - 60, 2);
    txt('SCORE', 30, 462, 20, '#fff', 'left');
    txt(String(G.score), W - 30, 462, 22, '#ffe060', 'right');
    if (G.score >= hiScore) txt('NEW HI-SCORE!', W / 2, 498, 18, '#ff8080');
    if (Math.floor(stateT * 2) % 2 === 0) txtCJK(G.stage < 5 ? '點擊 / ENTER → 前往第 ' + (G.stage + 1) + ' 關' : '點擊 / ENTER → 結局', W / 2, 548, 18, '#fff');
    if (G.stage < 5) txtCJK('下一關：' + STAGES[G.stage + 1].sub + '（炸彈 +1）', W / 2, 578, 13, '#aaa');
  }
  ctx.restore();
}

function drawEnding(dt) {
  CUR_STAGE = 5;
  const t = G.endT;
  updateBg(dt, 20, 4000 + t * 20);
  drawTerrain(4000 + t * 20, t);
  drawFarLayer(4000 + t * 20, t);
  drawNearLayer(4000 + t * 20);
  ctx.fillStyle = 'rgba(0,0,10,0.35)'; ctx.fillRect(0, 0, W, H);
  // 凱旋飛行的自機
  ctx.save(); ctx.translate(W / 2 + Math.sin(t * 0.7) * 80, H - 90 - Math.min(t * 10, 30) + Math.sin(t * 2) * 4); ctx.scale(1.3, 1.3); drawPlayerShape(Math.cos(t * 0.7) * 0.4, true); ctx.restore();
  const a = Math.min(1, t / 1.5);
  ctx.save(); ctx.translate(0, (H - 640) / 2);
  ctx.globalAlpha = a;
  const pulse = 1 + Math.sin(t * 3) * 0.05;
  ctx.save(); ctx.translate(W / 2, 120); ctx.scale(pulse, pulse);
  const g = ctx.createLinearGradient(0, -40, 0, 10); g.addColorStop(0, '#fff8c0'); g.addColorStop(1, '#ff9020');
  ctx.font = 'bold 54px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText('ALL CLEAR', 3, 3); ctx.fillStyle = g; ctx.fillText('ALL CLEAR', 0, 0);
  ctx.restore();
  const lines = ['敵軍總部已被摧毀，', '世界恢復了和平。', '', '感謝你的奮戰，王牌飛行員！'];
  for (let i = 0; i < lines.length; i++) if (t > 1.5 + i * 0.6) txtCJK(lines[i], W / 2, 180 + i * 28, 17, '#e0f0ff');
  if (t > 4) {
    txt('FINAL SCORE', W / 2, 330, 20, '#fff');
    txt(String(G.score), W / 2, 366, 34, '#ffe060');
    txt('HI-SCORE ' + hiScore, W / 2, 398, 15, '#ffd040');
    txtCJK('接關次數：' + G.continues + '　擊墜數：' + G.kills, W / 2, 426, 14, '#ccc');
    if (Math.floor(t * 2) % 2 === 0) txtCJK('點擊 / ENTER 回到標題', W / 2, 470, 16, '#fff');
  }
  txt('THANK YOU FOR PLAYING', W / 2, 615, 13, 'rgba(255,255,255,' + (0.4 + 0.3 * Math.sin(t * 2)) + ')');
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ================= 手機用按鈕（畫面外角落） ================= */
const UI = { pause: false };
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function mkBtn(id, txtc, css, fn) {
  const b = document.createElement('button');
  b.id = id; b.textContent = txtc; b.style.cssText = 'position:fixed;z-index:5;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,0.35);background:rgba(20,30,60,0.55);color:#fff;font:bold 18px sans-serif;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;' + css;
  const h = (e) => { e.preventDefault(); e.stopPropagation(); SFX.init(); fn(); };
  b.addEventListener('pointerdown', h);
  b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
  document.body.appendChild(b);
  return b;
}
const SND_ICON = ['🔊', '🎵✕', '🔇'];
const btnSnd = mkBtn('btnSnd', SND_ICON[SFX.mode], 'top:max(8px,env(safe-area-inset-top));right:8px;font-size:15px;', () => SFX.cycle());
const btnPause = mkBtn('btnPause', 'Ⅱ', 'top:max(8px,env(safe-area-inset-top));right:60px;', () => { if (state === 'play') UI.pause = true; else if (state === 'pause') pauseGame(false); });
const btnBomb = mkBtn('btnBomb', 'B', 'bottom:max(14px,env(safe-area-inset-bottom));right:14px;width:62px;height:62px;border-radius:31px;background:rgba(200,90,20,0.55);font-size:22px;', () => { if (state === 'play') touch.bomb = true; });
window.onSoundMode = (m) => { btnSnd.textContent = SND_ICON[m]; };
function layoutButtons() {
  const r = canvas.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  const top = r.top, right = vw - r.right, bottom = vh - r.bottom;
  let ty, tx; // 上方按鈕
  if (top >= 54) { ty = top - 50; tx = right + 8; }
  else if (right >= 54) { ty = r.top + 8; tx = Math.max(4, (right - 44) / 2 - 52 > 0 ? (right - 96) / 2 : (right - 44) / 2); }
  else { ty = r.top + r.height * (64 / H); tx = right + 6; }
  btnSnd.style.top = ty + 'px'; btnSnd.style.right = tx + 'px';
  btnPause.style.top = ty + 'px'; btnPause.style.right = (tx + 52) + 'px';
  if (right < 54 && top < 54) { btnPause.style.top = (ty + 50) + 'px'; btnPause.style.right = tx + 'px'; }
  let by, bx; // 炸彈鈕
  if (bottom >= 74) { by = bottom - 70; bx = right + 10; }
  else if (right >= 72) { by = bottom + 20; bx = Math.max(4, (right - 62) / 2); }
  else { by = bottom + r.height * (60 / H); bx = right + 10; }
  btnBomb.style.bottom = by + 'px'; btnBomb.style.right = bx + 'px';
}
window.addEventListener('resize', () => setTimeout(layoutButtons, 50));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(layoutButtons, 50));
function updateButtons() {
  layoutButtons();
  btnPause.style.display = (state === 'play' || state === 'pause') ? 'block' : 'none';
  btnPause.textContent = state === 'pause' ? '▶' : 'Ⅱ';
  btnBomb.style.display = IS_TOUCH && state === 'play' ? 'block' : 'none';
}

/* ================= 主迴圈 ================= */
const STEP = 1 / 60;
let acc = 0, lastT = performance.now();
let fpsEma = 60, fpsN = 0, fpsT = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fpsEma = fpsN / fpsT; fpsN = 0; fpsT = 0; }
  updateHud(dt);
  acc += dt * SPEED;
  if (hit('KeyM')) SFX.toggleMute();
  let steps = 0;
  while (acc >= STEP && steps < 5 * SPEED) {
    acc -= STEP; steps++;
    stateT += STEP;
    if (state === 'play') updatePlay(STEP);
    else if (state === 'pause') { if (hit('KeyP')) pauseGame(false); else if (hit('Escape')) { SFX.pause(false); saveHi(); setState('title'); } else if (touch.tap) { touch.tap = false; pauseGame(false); } }
    else if (state === 'gameover') updateGameOver(STEP);
    else if (state === 'clear') updateClear(STEP);
    else if (state === 'ending') updateEnding(STEP);
    if (state !== 'title') { clearPressed(); touch.tap = false; }
  }
  if (acc > STEP * 5 * SPEED) acc = 0;
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if (state === 'title') { stateT += dt; drawTitle(dt); clearPressed(); touch.tap = false; }
  else if (state === 'ending') { drawEnding(dt); }
  else {
    drawWorld(dt);
    if (state !== 'clear') drawHUD(); else { txt(String(G.score), W / 2, 22, 16, '#fff'); }
    if (state === 'pause') drawPause();
    if (state === 'gameover') drawGameOver();
    if (state === 'clear') drawClear();
  }
  requestAnimationFrame(frame);
}
window.addEventListener('beforeunload', saveHi);
initClouds();
updateButtons();
if (AUTO) startGame(); else MUSIC.play('title');
requestAnimationFrame(frame);

// 測試用掛鉤
window.__raiden = { get state() { return state; }, get G() { return G; }, get player() { return player; }, get boss() { return boss; }, enemies, eBullets, beams, items, particles, explode, addScore, startGame, nextStage, hud, get fps() { return fpsEma; }, get fxCount() { return particles.length; } };

</script>
